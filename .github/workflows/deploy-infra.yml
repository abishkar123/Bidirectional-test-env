name: Deploy Infrastructure (Terraform)

on:
  push:
    branches: [main, development]
    paths:
      - "infra/terraform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options: [staging, production]

env:
  TF_WORKING_DIR: infra/terraform
  # Provider / backend authentication (OIDC)
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  # Terraform input variables — injected from secrets so no tfvars is committed.
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_deployment_sp_object_id: ${{ secrets.DEPLOYMENT_SP_OBJECT_ID }}
  TF_VAR_alert_email_address: ${{ secrets.ALERT_EMAIL_ADDRESS }}

permissions:
  id-token: write
  contents: read

jobs:
  # ── Resolve which environment this run targets ────────────────────────────────
  resolve-env:
    name: Resolve Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - name: Resolve from branch or manual input
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ github.event.inputs.environment }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$INPUT_ENV" in
              staging|production) echo "environment=$INPUT_ENV" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error::Invalid environment input: $INPUT_ENV"; exit 1 ;;
            esac
          elif [ "$REF_NAME" = "main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

  # ── Terraform plan + apply in one protected job (keeps tfplan off artifacts) ──
  terraform-deploy:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    needs: resolve-env
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: ${{ needs.resolve-env.outputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Show outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
